# Options specifically for Idler's 'presently' environment.

GooglePlayStore:
  EnableGoogleAuthentication: true
  GooglePlayApplicationId: example-project-idler
  GooglePlayOAuth2ClientCredentialsPath: kube-secret://user-google-oauth#json
  AndroidPublisherApiServiceAccountPath: kube-secret://user-idler-sa#credentials
  EnableAndroidPublisherApi: true
  GooglePlayPublicKey: ""


WebLogin:
  Clients:
    "UnityWebGL":
      Scopes: "game.session"
      AllowedRedirectUrls: "https://lovely-wombats-build-presently-assets.p2-eu.metaplay.dev/"

ClientConnection:
  CommitIdCheckRule: OnlyIfDefined

AppleStore:
  # io.metaplay.idler-demo is the bundle ID of our internal "Metaplay Idler" in Testflight, which connects to the 'nimbly' environment.
  IosBundleId: io.metaplay.idler-demo
  AppleSharedSecretPath: "kube-secret://user-apple-shared-secret#secret"
  AppStoreConnectApiCredentialsPath: "kube-secret://user-appstoreconnect-creds#credentials"
