# Configuration files to use
config:
  files:
    - "./Config/Options.base.yaml"
    - "./Config/Options.dev.yaml"
    - "./Config/Options.quickly.yaml"

# Configure simple distributed setup
shards:
  - name: logic
    nodeCount: 2
    requests:
      cpu: 250m
      memory: 500Mi
    connection: true
    publicWebApi: true
  - name: service
    nodeCount: 1
    requests:
      cpu: 150m
      memory: 750Mi
    admin: true

publicWebApi:
  enabled: true

experimental:
  websockets:
    enabled: true
  gameserversV0Api:
    enabled: true
