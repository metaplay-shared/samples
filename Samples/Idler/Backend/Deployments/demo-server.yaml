# Environment name and family
environment: demo
environmentFamily: Development

# Configuration files to use
config:
  files:
    - "./Config/Options.base.yaml"
    - "./Config/Options.dev.yaml"
    - "./Config/Options.demo.yaml"

# Enable config discovery from infra
tenant:
  discoveryEnabled: true

# Enable websockets
experimental:
  websockets:
    enabled: true
