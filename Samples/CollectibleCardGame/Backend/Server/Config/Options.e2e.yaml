# The end-to-end suites' pacing profile, layered over Options.base.yaml and Options.local.yaml. Only the
# suites load it — `metaplay dev server` sets no METAPLAY_OPTIONS and gets the local pacing instead. Callers:
# e2e.toml (the shared server of run_e2e.py) and WebClient.Tests/GameServerProcess.cs. AGENTS.md §"Tests"
# has the rest: why METAPLAY_OPTIONS rather than METAPLAY_EXTRA_OPTIONS, and how to read back what a server actually
# bound.
#
# Each value below is shortened to buy suite time, lengthened so no fixture is overtaken by it, or fixed so every run
# plays the same game.
# Nothing here is a free knob: the comments say what breaks if you change one.

Match:
  # Gone. The single biggest cost in the match suites, and pure wall time — the delay is drawn from a
  # host-side stream rather than the match's seeded RNG, so a game plays out action for action the same at
  # zero. BotTurnBudget is left alone: a zero floor short-circuits the budget anyway.
  BotActionDelay: "00:00:00"
  BotActionDelayJitter: "00:00:00"

  # Shortened, not zeroed: a bound on a stall, since no fixture waits it out. It cannot go much lower — the
  # stamp is already running while the client attaches and turns its page.
  MulliganDeadline: "00:00:15"

  # Long on purpose. MatchTests.ADoublePressCostsExactlyOneTurn reads that there is no deadline ring early in
  # a turn, which a deadline inside the ring's twenty-second window would break. MatchStrikeTests lapses turns
  # on demand rather than waiting for this.
  TurnDeadline: "00:05:00"

  # Every table is dealt from these rather than from a cryptographic seed, so a fixture meets the same deal, Weather,
  # first seat and bot choices on every run instead of passing on most deals. The match suites reach what they need
  # on this deal: TouchDragCanCancelPlayAndAttack, for one, gets an attacker before the bot wins. A new card, deck or
  # rule moves the deal, so a fixture that then fails does so on every run.
  FixedDealSeed: 1
  FixedBotSeed: 2

  # Left at their defaults deliberately, because a profile named "e2e pacing" invites zeroing them:
  #   JoinWindow (15 s)           — shipped value; lengthening it means no suite ever runs the window.
  #   PresentationAllowance (3 s) — added to every positive clock above, so they arm three seconds longer.
  #   EffectChoiceDeadline (20 s) — shorter than the peek helpers' wait would default the choice out.
  #   DisconnectGrace (30 s)      — TransportOutageTests drops a seat's session and asserts no cover.
  #   TimerPadding (50 ms)        — a punctual timer fires early and the lapse check then no-ops.

Matchmaking:
  # Shortened, not zeroed. It bounds the SOLO case, which would otherwise cost 45 s a run; the pairing cases
  # never wait it out. Zero would mean "form on the first waiter", making a two-player seat impossible by
  # construction and quietly turning the pairing proof into a second solo one. The policy is unit-tested at
  # zero instead. SearchingBound and SeatedBound are left alone; the load-time validation refuses a fill wait
  # that breaks either bound, so a profile that did would fail the server's start.
  FillWait: "00:00:08"
