# Option overrides when running the server locally

# Bind the WebSocket listener to all interfaces (default is 127.0.0.1 in local environments) so the
# browser-based WebClient can connect from other devices on the LAN, not just this machine.
WebSockets:
  ListenHost: "0.0.0.0"

# Match pacing for a locally running server, which is also what the Playwright match fixtures drive. Bot
# delays are shortened for local iteration. The turn deadline is lengthened past any test run, so no fixture
# is overtaken by it; a human playing locally still gets a deadline and a ring.
Match:
  MulliganDeadline: "00:01:00"
  TurnDeadline: "00:05:00"
  BotActionDelay: "00:00:00.250"
  BotActionDelayJitter: "00:00:00.150"
