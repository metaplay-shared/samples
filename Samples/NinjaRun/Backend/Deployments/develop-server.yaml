# Helm values for the Develop environment (whole-impalas-strive-quickly on p2-eu.metaplay.dev).
#
# The Blazor WASM WebClient is served from the environment's CDN (`metaplay deploy webclient`), at
# https://whole-impalas-strive-quickly-assets.p2-eu.metaplay.dev/, and opens its game connection over the
# WebSocket gateway on the bare environment domain. `publicWebApi.enabled` turns on the PublicWebApi host on the
# "-public" domain, https://whole-impalas-strive-quickly-public.p2-eu.metaplay.dev/, whose root redirects to the
# web client.

# Configuration files to use
config:
  files:
    - "./Config/Options.base.yaml"
    - "./Config/Options.dev.yaml"

publicWebApi:
  enabled: true
